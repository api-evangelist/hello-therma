summary: >-
  GlacierGrid runs a first-party status page with named components and a dated incident
  history. It publishes no API versioning policy, no deprecation policy, no Sunset/Deprecation
  header commitment (RFC 8594) and no SLA — which is consistent with having no public API
  contract to version. The MCP server carries no version in its path and its protocol version
  could not be read (the handshake is auth-gated).

