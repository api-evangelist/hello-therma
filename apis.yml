aid: hello-therma
name: Hello Therma
description: >-
  Hello Therma is the original brand of Therma, Inc., the San Francisco cold-chain and cooling
  intelligence company founded in 2014 by Manik Suri, which rebranded as GlacierGrid in February
  2024 and now operates as GlacierGrid, Inc. out of Richmond, Virginia. The platform pairs
  LoRaWAN temperature and humidity sensors, cellular monitoring hubs and BAS integrations with a
  cloud dashboard that gives multi-unit retail, restaurant, convenience-store, education and
  fitness operators remote refrigeration and HVAC monitoring, automated temperature logging for
  HACCP-style food-safety reporting, equipment-failure prediction and energy optimization across
  50 to 500 locations. GlacierGrid publishes no REST, GraphQL or SOAP API and no developer
  portal; its single machine-callable surface is a first-party remote Model Context Protocol
  server at mcp.glaciergrid.com, marketed as the GlacierGrid Connector for Claude, which exposes
  read-only facility, sensor, alert and energy data to an agent under OAuth with account-scoped
  permissions.
