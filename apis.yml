apis:
- name: GlacierGrid MCP Server
  description: >-
    First-party remote Model Context Protocol server exposing read-only GlacierGrid facility
    monitoring data — HVAC, refrigeration, energy and savings, sensor readings, issues,
    notifications, device connectivity and site weather — to an MCP client. Marketed as the
    GlacierGrid Connector for Claude and installed from the Claude connector directory. OAuth
    protected with `internal` and `customer` scopes, streamable-HTTP transport, no write
    operations. tools/list is auth-gated, so the tool schemas are not publicly readable.
  humanURL: https://www.glaciergrid.com/connector
  baseURL: https://mcp.glaciergrid.com/mcp
  tags:
  - Model Context Protocol
  - Agents
  - Monitoring
  - Energy
  properties:
  - type: MCPServer
    url: mcp/hello-therma-mcp.yml
  - type: Documentation
    url: https://www.glaciergrid.com/connector
